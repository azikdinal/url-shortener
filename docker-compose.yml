services:
  url-shortener:
    build: .
    image: url-shortener:latest
    container_name: url-shortener
    hostname: shortener
    restart: unless-stopped
    env_file: .env
    ports: "8000:${}"

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DBNAME}
    ports:
      - "5432:5432"
    networks:
      - default
