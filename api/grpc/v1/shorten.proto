syntax = "proto3";

package shorten.v1;

option go_package = "shorten/gen/grpc/v1/pb;pb";

service ShortenService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

message CreateRequest {
  string full_url = 1;
}

message CreateResponse {
  string short_url = 1;
}

message GetRequest {
  string short_url = 1;
}

message GetResponse {
  string full_url = 1;
}
